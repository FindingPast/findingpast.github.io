<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frutiger Aero | Finding Past</title>
  <link rel="icon" href="../indexIcon.ico" type="image/x-icon">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="home-link" href="../">← Back to Home</a>

  <div class="page-shell">
    <header class="page-header">
      <h1>Frutiger Aero</h1>
      <p class="page-subtitle">Build a nostalgic slideshow video with images, music, and preview controls.</p>
    </header>

    <nav class="tabs" aria-label="Frutiger Aero sections">
      <button type="button" class="tab-button active" data-tab="preview">Preview</button>
      <button type="button" class="tab-button" data-tab="images">Images</button>
      <button type="button" class="tab-button" data-tab="music">Music</button>
    </nav>

    <main class="page-content">
      <section id="preview" class="tab-panel active" aria-labelledby="preview-tab">
        <div class="stage-card">
          <div id="previewContainer" class="preview-stage">
            <img id="previewSlide" class="preview-media hidden" alt="Preview slideshow image">
            <div id="previewEmptyState" class="stage-empty">
              Preview is ready. Press Start Preview.
            </div>
          </div>
        </div>

        <audio id="previewAudio" class="visually-hidden" preload="metadata"></audio>

        <div class="controls-row">
          <button type="button" id="fullscreenButton">Fullscreen</button>
          <button type="button" id="previewControl">Start Preview</button>
          <button type="button" id="downloadButton">Download Video</button>
        </div>

        <div class="inline-card control-chip-row">
          <span>Preview will end after going through all</span>
          <button type="button" id="endConditionToggle">Images</button>
        </div>
      </section>

      <section id="images" class="tab-panel" aria-labelledby="images-tab">
        <div class="stage-card image-stage-card">
          <div class="image-square-wrapper">
            <img id="imageSlide" class="slideshow-media hidden" alt="Current image selection">
            <div id="imageEmptyState" class="stage-empty">
              No images loaded yet.
            </div>
          </div>
        </div>

        <div class="controls-row">
          <button type="button" id="prevImageButton">Previous</button>
          <button type="button" id="nextImageButton">Next</button>
        </div>

        <div class="slider-block">
          <label for="intervalSlider">Image Change Interval (seconds):</label>
          <input type="range" id="intervalSlider" min="1" max="20" value="5">
          <div id="intervalValue">5 seconds</div>
        </div>

        <div class="inline-card control-chip-row">
          <span>Fade out image at the end?</span>
          <button type="button" id="imageFadeToggle">No</button>
        </div>

        <div class="list-card">
          <div id="imageItemsContainer" class="media-list"></div>

          <button type="button" class="import-button" id="imageImportButton">
            Import Images
          </button>
          <input
            type="file"
            id="imageFileInput"
            accept=".jpg,.jpeg,.png,.gif,.webp"
            multiple
            hidden
          >
        </div>

        <div id="imageUndoNotification" class="undo-notification" aria-live="polite">
          <span id="imageUndoMessage"></span>
          <button type="button" id="imageUndoButton">Undo</button>
        </div>
      </section>

      <section id="music" class="tab-panel" aria-labelledby="music-tab">
        <div class="list-card">
          <div id="songItemsContainer" class="media-list"></div>

          <button type="button" class="import-button" id="songImportButton">
            Import Songs
          </button>
          <input
            type="file"
            id="songFileInput"
            accept=".mp3,.wav,.ogg,.m4a,.aac"
            multiple
            hidden
          >
        </div>

        <div id="songUndoNotification" class="undo-notification" aria-live="polite">
          <span id="songUndoMessage"></span>
          <button type="button" id="songUndoButton">Undo</button>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
